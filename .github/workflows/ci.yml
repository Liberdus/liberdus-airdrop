name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: "true"
  HARDHAT_DISABLE_TELEMETRY: "1"

jobs:
  contract-tests:
    name: Contract Tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Contract Tests
        run: npm test

  e2e-smoke:
    name: E2E Smoke
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Smoke E2E Tests
        run: npm run test:e2e:smoke

      - name: Upload Smoke E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  e2e-full:
    name: E2E Full
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Full E2E Tests
        run: npm run test:e2e

      - name: Upload Full E2E Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-full-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
